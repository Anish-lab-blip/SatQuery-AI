[pytest]
testpaths = tests
pythonpath = .
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::rasterio.errors.NotGeoreferencedWarning

# ---------------------------------------------------------------------------
# STEP 7 evidence categories (see docs/STEP7_BACKEND_CHAIN_REPORT.md).
#
# Registered so that `pytest -m unit` / `-m smoke` are working selectors and so
# that an unregistered mark is an error rather than a silent no-op. The markers
# exist to make a test's EVIDENCE CLASS explicit: a unit test never claims a
# deployment was exercised, and no test may be reported as "real inference"
# unless it ran the real model on real data in this environment.
#
# `environment_blocked` is not a test marker: a blocked path is reported in the
# STEP 7 report rather than encoded as a permanently-skipped test, because a
# skip can be mistaken for coverage.
# ---------------------------------------------------------------------------
markers =
    unit: fast, no I/O, no server, no network. Evidence about a component in isolation.
    integration: exercises two or more real components wired together in-process.
    smoke: a minimal end-to-end path run against real local artifacts, not a mock.
    real_inference: ran the real model on real inputs in this environment.
